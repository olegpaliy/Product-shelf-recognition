<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ХО · Image Recognition</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="side-nav" aria-label="Модулі">
      <button type="button" class="nav-item" data-nav="share" data-target="panel-share" disabled>
        Нумерична дистрибуція
      </button>
      <button type="button" class="nav-item" data-nav="details" data-target="panel-shelves" disabled>
        Нумерична дистрибуція (деталі)
      </button>
      <button type="button" class="nav-item active" data-nav="planogram" data-target="panel-cooler">
        Планограма ХО
      </button>
      <button type="button" class="nav-item" data-nav="missing" data-target="panel-missing" disabled>
        SKU не в планограмі
      </button>
      <button type="button" class="nav-item" data-nav="competitor" data-target="panel-competitor" disabled>
        Конкурент в ХО
      </button>
      <button type="button" class="nav-item" data-nav="visits" data-target="panel-qa">
        Розрахунок % візитів з фото і валідних фото
      </button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <p class="eyebrow">PoC · ХО / полиця</p>
          <h1>Планограма ХО</h1>
        </div>
        <button id="btn-back" class="btn outline hidden" type="button">← Інше фото</button>
      </header>

      <section id="screen-upload" class="screen">
        <div class="card">
          <h2>Фото для аналізу</h2>
          <div class="row">
            <label class="btn primary">
              Обрати фото
              <input id="file-input" type="file" accept="image/*" hidden />
            </label>
            <button id="btn-analyze" class="btn primary" type="button" disabled>Аналізувати</button>
          </div>
          <p id="upload-name" class="muted"></p>

          <h3>Або sample</h3>
          <div id="samples" class="samples"></div>
          <div id="progress" class="progress hidden">Аналіз… це може зайняти хвилину на CPU</div>
          <p id="error" class="error"></p>
        </div>
      </section>

      <section id="screen-result" class="screen hidden">
        <div class="result-layout">
          <div class="photo-col">
            <img id="annotated" alt="Annotated result" class="annotated" />
          </div>

          <aside class="side-panels">
            <div id="panel-cooler" class="card metric-panel highlight-target">
              <div class="panel-head">
                <h2>Планограма ХО</h2>
                <span id="compliance" class="metric-pill">—</span>
              </div>
              <p class="muted small"><strong>Схема:</strong> <span id="plan-source">—</span></p>
              <div id="cooler" class="cooler" aria-label="Схематичний холодильник"></div>
            </div>

            <div id="panel-qa" class="card metric-panel highlight-target">
              <h3>Фото / візит</h3>
              <div class="badge-row">
                <div id="qa-badge" class="badge"></div>
              </div>
              <p><strong>Детекцій:</strong> <span id="det-count">—</span></p>
            </div>

            <div id="panel-missing" class="card metric-panel highlight-target">
              <h3>SKU не в планограмі</h3>
              <p id="missing" class="metric-value">—</p>
            </div>

            <div id="panel-competitor" class="card metric-panel highlight-target">
              <h3>Конкурент в ХО</h3>
              <p id="competitor" class="metric-value">—</p>
            </div>

            <div id="panel-share" class="card metric-panel highlight-target">
              <h3>Нумерична дистрибуція</h3>
              <ul id="share-list"></ul>
            </div>

            <div id="panel-shelves" class="card metric-panel highlight-target">
              <h3>Дистрибуція (деталі)</h3>
              <ul id="shelf-list"></ul>
            </div>

            <div class="row exports">
              <a id="dl-excel" class="btn primary" href="#">Excel</a>
              <a id="dl-json" class="btn outline" href="#">JSON</a>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
